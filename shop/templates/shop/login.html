{% extends 'shop/base.html' %}
{% block title %}Đăng nhập - ShopQuanAo{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin:0 auto; border-top: 4px solid #2563eb;">
  <h2 style="margin-bottom:14px; color:#0f172a;">🔑 Đăng nhập tài khoản</h2>
  <form method="post" style="display:flex; flex-direction:column; gap:12px;">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next|default:'/' }}">
    <input type="text" name="username" placeholder="Nhập Gmail / Email (hoặc tài khoản admin)" required style="padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px;">
    <input type="password" name="password" placeholder="Mật khẩu" required style="padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px;">
    <button type="submit" class="btn btn-cobalt" style="padding:10px;">Đăng nhập</button>
  </form>
  <p style="margin-top:12px; font-size:0.86rem; color:#64748b; text-align:center;">
    Chưa có tài khoản? <a href="{% url 'register' %}" style="color:#ff5a36; font-weight:700;">Đăng ký ngay</a>
  </p>
</div>
{% endblock %}
